version: v0.4

project:
  name: Replica symmetry breaking at arbitrary depth
  description: >-
    A Lean formalization of open phases with every prescribed finite replica
    symmetry breaking depth in mixed even-spin Ising models at zero external
    field and positive temperature. The first selected result constructs strictly
    increasing even degrees beginning at four and a nonempty open set of
    positive effective covariance coefficients, with an optimizing probability
    measure having exactly k+1 support points. The independent statement uses
    concrete Gaussian Cole–Hopf recursions and comparison against all finite
    schemes at every competing depth. The substantive development constructs
    minimizers over all probability measures and includes the revised
    quadratic-inclusive universal transition, exact phase geometry and
    asymptotics, atomic Hessian, entropy, and analytic comparison results.
  authors:
    - P. M. Aronow
    - Patrick Lopatto
  responsible_maintainers:
    - P. M. Aronow
    - Patrick Lopatto
  license: MIT

classification:
  arxiv: [math.PR, math-ph]
  msc2020: [60K35, 82B44]

sources:
  - title: Replica symmetry breaking at arbitrary depth
    authors: [P. M. Aronow, Patrick Lopatto]
    id: https://arxiv.org/abs/2609.05317
    type: paper
    location: Theorems 1.1 and 1.2, manuscript revision (16)
    relationship: formalizes
    note: >-
      The mathematical comparison uses manuscript.tex SHA-256
      1216a3820a4d632228f0a1218a53c1feda73d04a6bb11ab3eab8cfa1db9c2b9f. The supplied Revision (16) source has SHA-256
      3302e39b8554fa851811c402d8aee3ccf32c8f37c727066f5c2fb79cd233bea6.
      The corrected source changes only introductory overlap interpretation
      and inclusive cutoff wording; numbered mathematical statements and
      bibliography are preserved. The repository contains the substantive
      development, with an independent
      finite-step statement for the open-phase theorem, including depth zero.
      The retained original transition is narrower; subsequent mathematical
      extensions prove the revised universal Theorem 1.2 and selected
      supporting targets. Both headline theorems have independent Challenge
      statements.

status:
  scope: >-
    Selected claims: open coefficient phases at every exact finite RSB depth,
    and the universal high-degree transition with a unique critical coupling.
    The Challenge compares every finite competitor depth. The underlying proof
    gives full probability-measure minimization. Revised universal transition
    wrappers allow quadratic terms under Xi.second 0 < 1 and use paper
    nondegeneracy; Hessian positivity is proved rather than assumed.
    General-measure time PDE assertions are distributional. All 41 nonremark
    numbered targets have complete or explicitly stronger faithful interfaces.
    The four remarks remain context; no complete formalization of all cited
    background or of Remark A.8's all-positive Banach wording is claimed.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  notes: >-
    Proof-hole counts exclude the two deliberate theorem placeholders in
    Challenge.lean. The selected Solution and its proof dependencies are
    required to be hole-free; mechanical results are in docs/VERIFICATION.md.
  main_results:
    - declaration: ArbitraryRSB.arbitrary_finite_depth_open_set
      file: Solution.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator.json
    - declaration: ArbitraryRSB.universal_gardner_transition
      file: Solution.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator.json

