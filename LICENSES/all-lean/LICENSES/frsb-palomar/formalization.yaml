fidelity:
  divergences: >-
    The independent headline quantifies over every minimizer and includes
    existence and uniqueness rather than relying on a chosen minimizer. It adds
    explicit density-plus-atom normalization. Closed-interval smoothness uses
    within derivatives at both endpoints and does not differentiate through the
    terminal CDF jump. The concrete weak-PDE value is defined by an infimum;
    existence and uniqueness identify its value on beta > 1. The selected support
    proof uses a strict covariance identity at zeros and a scalar crossing argument;
    the paper's full positive transport representation is separately formalized.
    Supporting stochastic results use a projective Gaussian probability space
    carrying a continuous Brownian modification and its natural filtration; no
    transport to every usual augmented Brownian space is asserted. Some supporting
    statements extend hypotheses to nonzero beta or arbitrary measures; scope
    differences are documented in MATHEMATICS.md. Mixed-p-spin and historical
    results quoted in the manuscript are cited background, not registry claims.
review:
