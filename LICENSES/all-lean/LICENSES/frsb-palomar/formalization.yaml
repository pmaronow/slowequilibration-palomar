version: v0.4
project:
  name: Full replica symmetry breaking in the Sherrington–Kirkpatrick model
  description: >-
    Lean formalization of Patrick Lopatto's zero-field Sherrington–Kirkpatrick
    results. The selected claims are full interval support, a nonnegative smooth
    density with a terminal atom for every inverse temperature beta > 1, and
    quantitative inequalities for that actual atom. The independent Challenge
    defines the Parisi functional through concrete bounded-gradient weak PDE
    solutions, with terminal log cosh and coefficient beta squared divided by two.
    Solution identifies that definition with the constructed Parisi potential.
    The repository retains the supporting PDE, diffusion, covariance, minimizer,
    and numbered-result development described in COVERAGE.md and results.json.
  authors:
  - P. M. Aronow
  - Patrick Lopatto
  responsible_maintainers:
  - P. M. Aronow
  - Patrick Lopatto
  license: MIT
