limitations:
  - >-
    Mathematical assertions are the exact statements in each Challenge,
    not a claim that independent kernels check all of the manuscript's
    prose or that all proof-library sources appear in every selected
    Comparator export. Full-source build and axiom audits are separate checks.
  - >-
    The response derivative is into terminal L2 of the actual projected
    nonlinear restart. General L2_loc forcing denotes the forced physical
    variational equation; the manuscript does not assert a full nonlinear
    forced-solution Fréchet theorem in that domain.
  - >-
    Chronological slow fluctuation-dissipation ratio, a matching susceptibility
    upper bound, and an identified aging clock remain declared open predictions
    and are not included among the proved results.
  - >-
    Seven cited originals retain precisely disclosed partial-access limits.
    No new full-primary-source verification is claimed from metadata checks.
