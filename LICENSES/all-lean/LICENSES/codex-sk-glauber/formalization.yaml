  name: 'SK constant optimization: verified development'
  description: Forty-six independently stated Lean claims cover the strict exponent range, actual finite
    Gibbs and continuous-time heat-bath dynamics, balanced-flow mixing and the joint SK-start reduction,
    entropy coverage and spin crossing, scalar Gaussian channels, Brownian meshes, Gaussian entropy, and
    concrete dyadic/weighted Cholesky algebra. The full optimized SK mixing theorem remains unproved.
