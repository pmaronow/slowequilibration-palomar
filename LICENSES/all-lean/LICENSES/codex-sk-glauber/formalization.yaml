  methods:
  - method: autonomous
    models:
    - GPT-6
    framework: Codex multi-agent workspace
    tool_setup: Autonomous proof research and independent agent audits; Lean 4, Mathlib, linarith, norm_num,
      ring, elementary analysis and graph proofs; toolchain-bundled Comparator, Lean checker, NanoDa,
      and con-ron.
    cost:
      wall_time: elapsed effort recorded in progress.log; exact total compute time not tracked
      spend_usd: not tracked
      hardware: managed cloud executor
    prompting_notes: User requested autonomous constant optimization, followed by the simplest streamlined
      proof, a writeup, and Lean formalization to Palomar standards. Parallel agents were instructed to
      audit the mathematics skeptically and distinguish finite certificates from the unformalized full
      SK theorem.
  spend_usd: not tracked
  notes: Development was produced in AI agent sessions; the continued Parisi proofs also adapt explicitly
    attributed Apache-2.0 OpenAI Lean sources at commit fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb. No
    human proof review, registry submission, publication, or endorsement by the source authors occurred.
    Human author attribution and a responsible maintainer have not been specified; the empty fields above
    deliberately prevent treating this metadata as submission-ready.
fidelity:
  divergences: The informal optimized exponent range is 0<c<1/4, while the source states c=1/40000000.
    Lean proves the strict parameter system and a broad collection of genuine analytic, probabilistic,
    geometric and finite-chain ingredients. It defines actual GOE disorder, Gibbs-start law and continuous-time
    dynamics and proves their reduction to a high-probability balanced-flow estimate. That model-specific
    estimate and the full theorem remain unproved. The fixed-field continuous tanh identities,
    normalized posterior row moments and block lag bounds are proved; the full random-seed Parisi
    process and source scalar callbacks are now constructed. The literal algorithm iid-row law,
    linked likelihood and energy domination, sharp weighted temporal concentration, grid quadrature,
    connecting paths and actual witness exclusion remain open. These limits are explicit in README.md and the protected
    statements.
review:
  status: AI self-assessed; no independent human editorial review
  reviewers:
  - none
  notes: Parallel AI mathematical audits, independent statement/parameter review, successful clean builds,
    source-structure checks, axiom inspection, and bundled Comparator replay through three kernels. Palomar
    editorial interest and statement fidelity have not been assessed by the registry.
