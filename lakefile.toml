name = "slowEquilibration"
version = "1.0.0"
defaultTargets = ["Solution", "Audit"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

[[lean_lib]]
name = "SlowEquilibration"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "Audit"

[[lean_lib]]
name = "BrownianMotion"
srcDir = "vendor/all-lean"
globs = ["BrownianMotion.+"]

[lean_lib.leanOptions]
autoImplicit = true

[[lean_lib]]
name = "Common"
srcDir = "vendor/all-lean"
globs = ["Common.+"]

[[lean_lib]]
name = "FRSB"
srcDir = "vendor/all-lean"
globs = ["FRSB.+"]

[[lean_lib]]
name = "FourPapersCommon"
srcDir = "vendor/all-lean"
globs = ["FourPapersCommon.+"]

[[lean_lib]]
name = "KolmogorovExtension4"
srcDir = "vendor/all-lean"
globs = ["KolmogorovExtension4.+"]

[lean_lib.leanOptions]
autoImplicit = true

[[lean_lib]]
name = "Lemmas"
srcDir = "vendor/all-lean"
globs = ["Lemmas.+"]

[lean_lib.leanOptions]
autoImplicit = true

[[lean_lib]]
name = "OverlapPaper"
srcDir = "vendor/all-lean"
globs = ["OverlapPaper.+"]

[[lean_lib]]
name = "Paper"
srcDir = "vendor/all-lean"
globs = ["Paper", "Paper.+"]

[[lean_lib]]
name = "ParisiFormula"
srcDir = "vendor/all-lean"
globs = ["ParisiFormula.+"]

[lean_lib.leanOptions]
autoImplicit = true

[[lean_lib]]
name = "QuantitativeFollowup"
srcDir = "vendor/all-lean"
globs = ["QuantitativeFollowup.+"]

[[lean_lib]]
name = "QuantitativePaper"
srcDir = "vendor/all-lean"
globs = ["QuantitativePaper.+"]

[[lean_lib]]
name = "StochasticCalculus"
srcDir = "vendor/all-lean"
globs = ["StochasticCalculus.+"]

[[lean_lib]]
name = "Targets"
srcDir = "vendor/all-lean"
globs = ["Targets.+"]

[lean_lib.leanOptions]
autoImplicit = true

[[lean_lib]]
name = "SphericalAging"
srcDir = "vendor/all-lean"
globs = ["SphericalAging.+"]

[[lean_lib]]
name = "OAI"
srcDir = "vendor/openai-math"
globs = ["OAI.+"]

[lean_lib.leanOptions]
autoImplicit = false

[[lean_lib]]
name = "SixHeadlines"

[[lean_lib]]
name = "SixHeadlinesAudit"

[[lean_lib]]
name = "PressureLowerTailsAudit"
