# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/v0.4.schema.json
version: v0.4
project:
  name: Slow Equilibration and Persistent Stationary Correlations in Spherical Spin Glasses
  description: 'Lean formalization of the six headline result groups: Theorem 1.2, Corollary 1.3, and
    Theorems 1.4–1.7. Theorem 1.2, Corollary 1.3, and the asymptotic clauses of Theorem 1.4 are conditional
    only on Chen’s finite-mixture Parisi formula. Universal pressure lower tails are proved internally.
    The finite-dimensional Haar comparison and Theorems 1.5–1.7 have no literature premise. The manuscript
    and exact model assumptions are included.'
  authors:
  - P. M. Aronow
  responsible_maintainers:
  - P. M. Aronow
  license: Apache-2.0
classification:
  arxiv:
  - math.PR
  - math.LO
  msc2020:
  - 60K35
  - 82B44
  - 03B35
sources:
- title: Slow Equilibration and Persistent Stationary Correlations in Spherical Spin Glasses
  authors:
  - P. M. Aronow
  - Patrick Lopatto
  type: paper
  relationship: formalizes
  location: manuscript/main.tex and manuscript/main.pdf
  note: Exactly the six headline groups numbered 1.2–1.7, with supporting proofs. The supplied author’s
    note and final manuscript text are preserved.
- title: The Aizenman–Sims–Starr scheme and Parisi formula for mixed p-spin spherical models
  authors:
  - Wei-Kuo Chen
  id: https://arxiv.org/abs/1204.5115v1
  type: paper
  relationship: background
  location: Theorem 1 and its Crisanti–Sommers representation
  note: Chen2013FiniteParisi remains an explicit unproved premise for the first three headline groups.
    It identifies the actual finite-mixture quenched pressure limit with the variational value; it is
    not introduced as a global axiom.
- title: Free energy landscapes in spherical spin glasses
  authors:
  - Eliran Subag
  id: https://arxiv.org/abs/1804.10576v6
  type: paper
  relationship: background
  location: Lemma 22 and the generalized TAP results cited by the manuscript
  note: Universal PressureLowerTails, corresponding to Lemma 22, is proved internally for every finite
    mixture and every real inverse temperature. No Subag proposition is a premise of an advertised headline
    theorem. Historical module and predicate names retain their source attribution.
